[project]
name = "whoop-open-source"
version = "0.1.0"
description = "Two-source WHOOP data pipeline: official API v2 and reverse-engineered BLE, kept in separate local stores."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8.0"]

[project.scripts]
whoop = "whoop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whoop", "whoop.api", "whoop.ble", "whoop.web"]

[tool.setuptools.package-data]
"whoop.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
